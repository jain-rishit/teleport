image: rust:latest

stages:
  - build
  - test
  - clippy
  - secret-detection

variables:
  SECRET_DETECTION_ENABLED: 'true'
  CARGO_HOME: $CI_PROJECT_DIR/.cargo

cache:
  paths:
    - .cargo/
    - target/

build:
  stage: build
  script:
    - cargo check
  artifacts:
    paths:
      - target/debug/

test:
  stage: test
  script:
    - cargo test --all

clippy:
  stage: clippy
  script:
    - rustup component add clippy
    - cargo clippy -- -D warnings

secret_detection:
  stage: secret-detection

include:
  - template: Security/Secret-Detection.gitlab-ci.yml
